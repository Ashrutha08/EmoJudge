
apiVersion: v1
kind: Service
metadata:
  name: emojudge-web-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: emojudge-web
  ports:
    - name: web
      protocol: TCP
      port: 5000
      targetPort: 5000
      nodePort: 30500

---
apiVersion: v1
kind: Service
metadata:
  name: emojudge-api-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: emojudge-api
  ports:
    - name: api
      protocol: TCP
      port: 8000
      targetPort: 8000
      nodePort: 30800
