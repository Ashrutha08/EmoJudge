
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emojudge-web
  namespace: default
  labels:
    app: emojudge-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emojudge-web
  template:
    metadata:
      labels:
        app: emojudge-web
    spec:
      containers:
        - name: emojudge-web
          image: emojudge-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: web
              containerPort: 5000
              protocol: TCP
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: emojudge-api
  namespace: default
  labels:
    app: emojudge-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: emojudge-api
  template:
    metadata:
      labels:
        app: emojudge-api
    spec:
      containers:
        - name: emojudge-api
          image: emojudge-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: api
              containerPort: 8000
              protocol: TCP
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 4Gi
